# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Fully overrides the generated resource name prefix.
fullnameOverride: ""
# -- Image pull secrets applied to every pod in this release.
imagePullSecrets: []

image:
  # -- Registry for the RustDesk server image.
  registry: docker.io
  # -- The "classic" upstream image. It is built `FROM scratch` and holds only the
  # `hbbs` and `hbbr` binaries — there is no shell, so `kubectl exec` and `kubectl cp`
  # do not work against these containers and `exec` probes are impossible.
  repository: rustdesk/rustdesk-server
  # -- Image tag. Defaults to the chart's appVersion. Avoid `latest`: this chart is
  # published to strangers, and a floating tag ships them upstream changes that never
  # passed CI here.
  tag: ""
  pullPolicy: IfNotPresent

# Utility images. Used only for key provisioning and `helm test`, never to serve traffic.
utilsImage:
  registry: docker.io
  # -- The upstream s6 image. Used because it is the only official image that carries
  # `rustdesk-utils` and a busybox shell. Its supervisor is never started.
  repository: rustdesk/rustdesk-server-s6
  # -- Defaults to the chart's appVersion, so it always matches the server image.
  tag: ""
  pullPolicy: IfNotPresent

kubectlImage:
  # -- The Kubernetes project's own kubectl image, used to read and write the key Secret.
  registry: registry.k8s.io
  repository: kubectl
  tag: "v1.31.4"
  pullPolicy: IfNotPresent

key:
  # -- Name of the Secret holding the key pair. Defaults to `<fullname>-key`.
  # This Secret is the source of truth: the persistent volume is only a cache of it.
  # The chart does not template this Secret — an initContainer creates it — so Helm
  # never owns an object whose contents it does not manage, and the key survives
  # `helm uninstall` without a retention annotation.
  secretName: ""
  # -- Use a key pair you already have instead of generating one. Set this to the name
  # of a Secret containing `id_ed25519` and `id_ed25519.pub`. This is the migration
  # path from docker-compose or another chart — see docs/migration.md. When set, the
  # chart neither generates a key nor needs RBAC to create a Secret.
  existingSecret: ""
  # -- Key within `existingSecret` holding the base64 private key.
  privateKeyKey: id_ed25519
  # -- Key within `existingSecret` holding the base64 public key.
  publicKeyKey: id_ed25519.pub

serviceAccount:
  # -- Create a ServiceAccount for the key-provisioning initContainers.
  create: true
  # -- Use an existing ServiceAccount instead. Ignored when `create` is true.
  name: ""
  annotations: {}

rbac:
  # -- Create the Role and RoleBinding that let the initContainers read and create the
  # key Secret. Only needed when the chart generates the key; set to false alongside
  # `key.existingSecret`. Note that RBAC cannot scope `create` to a single resource
  # name, so the Role grants `create` on Secrets in this namespace.
  create: true

hbbs:
  # -- Deploy the hbbs role: ID registration, rendezvous and hole punching.
  # Disable it to install a relay-only release (see `hbbr.key`).
  enabled: true

  # -- Base port. hbbs derives its other ports from this one in code: the NAT-type test
  # listens on `port - 1` and the WebSocket transport on `port + 2`. Changing it is
  # rarely a good idea — clients derive the relay address as `<their ID server host>:<its
  # port + 1>`, so a non-default port here makes them derive the WebSocket relay port
  # instead of the relay port. See docs/adr/0005-empty-relay-servers-default.md.
  port: 21116

  config:
    # -- Force all sessions through the relay, disabling hole punching (ALWAYS_USE_RELAY).
    alwaysUseRelay: false
    # -- Explicit relay addresses passed to `-r`, as `host` or `host:port`.
    # Leave empty unless the relay is not reachable at `<ID server host>:<port + 1>`.
    # An empty list is correct, not incomplete: hbbs advertises no relay address at all,
    # and the client derives one from the ID server address its own user typed.
    # Set this when running relay-only releases — multiple entries also enable hbbs's
    # round-robin and its relay health check, which is otherwise never started.
    relayServers: []
    # -- SQLite path (DB_URL). Defaults to `db_v2.sqlite3` inside the working directory,
    # which is the persistent volume.
    dbUrl: ""
    # -- UDP receive buffer in bytes (RMEM). Raising this also requires raising
    # `net.core.rmem_max` on the node, which this chart does not do.
    rmem: 0
    # -- hbbs pings its own UDP listener once a second for the life of the process and
    # calls `exit(1)` if replies stop for 12 seconds. It targets loopback, never the
    # external address, so it is safe behind a LoadBalancer and is left enabled.
    # Setting this to false emits `TEST_HBBS=no`.
    selfTest: true

  service:
    # -- `LoadBalancer` preserves the client source IP when paired with
    # `externalTrafficPolicy: Local`, which is a correctness requirement rather than a
    # preference: hbbs stores the observed packet source as the peer's NAT endpoint and
    # hands it to the other peer to dial. Behind any SNAT-ing hop, every session silently
    # falls back through the relay.
    type: LoadBalancer
    # -- Must stay `Local`. `Cluster` rewrites the source address and breaks hole punching
    # in a way that still looks like a working install.
    #
    # With `NodePort`, `Local` also means only the node currently running the pod answers on
    # the node port. Many external port forwarders and simple L4 balancers target a fixed
    # address and cannot see Endpoints, so they will point at a black hole whenever the pod
    # moves. Pin the pod with `nodeSelector` and target the same node. See docs/exposure.md.
    externalTrafficPolicy: Local
    loadBalancerIP: ""
    loadBalancerClass: ""
    # -- To place hbbs and hbbr on a single address with MetalLB, set the same
    # `metallb.universe.tf/allow-shared-ip` value on both Services. They have no
    # overlapping ports, so sharing is safe. Not the default, because the annotation is
    # MetalLB-specific and would break the chart on other load balancer implementations.
    annotations: {}
    nodePorts:
      natTest: null
      main: null
      websocket: null

  webClient:
    # -- Expose the WebSocket transport on `port + 2` (21118 by default).
    # Off by default: this port accepts `X-Real-IP` and `X-Forwarded-For` without
    # validation and overwrites the peer's address with whatever the header claims, so
    # anyone who can reach it directly can present themselves as any source IP.
    # Only enable it behind a proxy that OVERWRITES those headers rather than passing
    # them through. This chart ships no Ingress; see docs/adr/0006.
    enabled: false

  # -- Run with the host's network namespace instead of a LoadBalancer. This is what
  # upstream's own documentation recommends and it guarantees the real source IP, at the
  # cost of pinning the pod to a node and claiming ports 21115-21119 across the cluster.
  hostNetwork: false

  persistence:
    enabled: true
    # -- Use a volume you already have. The reason this chart uses a plain PVC rather
    # than a StatefulSet `volumeClaimTemplate`: a claim template names PVCs by ordinal
    # and cannot be pointed at an existing volume, which would block both migration and
    # restore from backup.
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}
    # -- Keep the PVC on `helm uninstall`.
    retain: true

  # -- The key pair and the SQLite database live here, and it is the container's
  # working directory — both binaries write relative to their CWD, which is what makes
  # a read-only root filesystem possible.
  dataDir: /data

  extraEnv: []
  extraArgs: []

  # -- No defaults on purpose. Traffic profiles for a rendezvous server vary by orders
  # of magnitude between a five-device homelab and a fleet, and a wrong default is worse
  # than none.
  resources: {}

  livenessProbe:
    enabled: true
    tcpSocket: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    # -- Deliberately tolerant. This is a single-replica stateful pod, so a false
    # positive is more expensive than a slow restart. hbbs also watchdogs its own UDP
    # path and exits on failure, which catches what a TCP probe cannot see.
    failureThreshold: 6
  readinessProbe:
    enabled: true
    tcpSocket: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

hbbr:
  # -- Deploy the hbbr role: the relay used when peers cannot connect directly.
  enabled: true

  # -- hbbr pairs the two peers of a session by UUID inside a single process, so two
  # replicas behind one Service silently fail to pair whenever the peers land on
  # different pods. `sessionAffinity` does not help — the two peers have different
  # client IPs by definition. Add relay capacity with additional relay-only releases at
  # distinct addresses, listed in `hbbs.config.relayServers`.
  replicaCount: 1

  # -- Base port. The WebSocket transport listens on `port + 2`. Passed with `-p`, never
  # via the PORT environment variable, which upstream interprets as `PORT + 1`.
  port: 21117

  key:
    # -- Reject clients that do not present this installation's public key. Upstream
    # defaults this off, which makes the relay usable by anyone who knows its address —
    # with default limits of 128 Mb/s per connection and 1024 Mb/s aggregate.
    # hbbr only ever holds the PUBLIC key: it compares an opaque string and performs no
    # signature verification or decryption, so the private key never leaves the hbbs pod.
    validation: true
    # -- For a relay-only release (`hbbs.enabled: false`), supply the installation's
    # public key here, or name a Secret below. Within a release that also runs hbbs,
    # leave both empty and the chart wires up the generated key automatically.
    publicKey: ""
    existingSecret: ""
    existingSecretKey: id_ed25519.pub

  config:
    # -- Per-connection bandwidth cap, Mb/s (SINGLE_BANDWIDTH).
    singleBandwidth: 128
    # -- Aggregate bandwidth cap, Mb/s (TOTAL_BANDWIDTH).
    totalBandwidth: 1024
    # -- Cap applied after a downgrade, and to blacklisted IPs, Mb/s (LIMIT_SPEED).
    limitSpeed: 32
    # -- Fraction of `singleBandwidth` that triggers a downgrade (DOWNGRADE_THRESHOLD).
    downgradeThreshold: "0.66"
    # -- Seconds before a connection becomes eligible for downgrade (DOWNGRADE_START_CHECK).
    downgradeStartCheck: 1800

  lists:
    # -- Mount `blacklist.txt` and `blocklist.txt` from a ConfigMap. hbbr reads these
    # once at startup from its working directory, and edits made through its runtime
    # console are in-memory only — so a ConfigMap is the only way to make them survive
    # a restart.
    enabled: false
    # -- Bandwidth-limited IPs, one per line.
    blacklist: []
    # -- Refused IPs, one per line.
    blocklist: []

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    loadBalancerIP: ""
    loadBalancerClass: ""
    annotations: {}
    nodePorts:
      main: null
      websocket: null

  webClient:
    # -- Expose the WebSocket relay on `port + 2` (21119 by default). Carries the same
    # unvalidated-header risk as `hbbs.webClient.enabled`.
    enabled: false

  hostNetwork: false

  # -- Working directory. hbbr writes nothing here when a key is supplied explicitly,
  # which is what this chart always does.
  dataDir: /data

  extraEnv: []
  extraArgs: []
  resources: {}

  livenessProbe:
    enabled: true
    tcpSocket: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    enabled: true
    tcpSocket: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

networkPolicy:
  # -- These pods are deliberately reachable from the entire internet, so the ingress
  # half of a policy restricts very little. The useful half is egress. Off by default,
  # but worth enabling under a default-deny policy.
  enabled: false
  # -- Additional egress rules, appended to the DNS and Kubernetes API rules the chart
  # already emits.
  extraEgress: []

tests:
  # -- Ship a `helm test` Pod that asserts the Services have endpoints and the key
  # Secret exists and is non-empty. It runs inside the cluster, so it cannot exercise
  # the LoadBalancer path, `externalTrafficPolicy`, or UDP.
  enabled: true
