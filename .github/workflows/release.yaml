name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: sigstore/cosign-installer@v3

      - name: Chart version matches the tag
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          chart=$(helm show chart . | awk '/^version:/ {print $2}')
          test "$tag" = "$chart" || {
            echo "tag $tag does not match Chart.yaml version $chart" >&2; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        id: push
        run: |
          set -eu
          helm package . --destination dist
          version=$(helm show chart . | awk '/^version:/ {print $2}')
          helm push "dist/rustdesk-server-${version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/helm-charts 2>&1 | tee push.log
          digest=$(awk '/^Digest:/ {print $2}' push.log)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          REF: ghcr.io/${{ github.repository_owner }}/helm-charts/rustdesk-server@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest the SBOM
        env:
          REF: ghcr.io/${{ github.repository_owner }}/helm-charts/rustdesk-server@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$REF"
